  stage.innerHTML=h;
  [].forEach.call(stage.querySelectorAll('.opts button'),function(b){b.addEventListener('click',function(){pick(q.opts[+b.getAttribute('data-i')])})});
  if(n===1)[].forEach.call(stage.querySelectorAll('.opts button'),function(b){var l=BR[q.opts[+b.getAttribute('data-i')].go];b.addEventListener('mouseenter',function(){hot(l)});b.addEventListener('focus',function(){hot(l)});b.addEventListener('mouseleave',function(){hot(null)})});
  var bk=stage.querySelector('.back');if(bk)bk.addEventListener('click',function(){n===2?one():two()});
  if(n>1)focusHead();
}
function one(){ask(Q1,1,function(o){ans.q1=o;track('fc_start');two()})}
function two(){ask(Q2[ans.q1.go],2,function(o){ans.q2=o;three()})}
function three(){ask(Q3,3,function(o){ans.q3=o;result()})}

function result(){
  var o=ans.q2,L=LANES[o.lane],slug=o.lane,when=ans.q3.v,A=o.also?LANES[o.also]:null;
  count.textContent='Your answer';hot(o.no?'-':null);openLane(o.no?null:slug);
  track('fc_done',{v:o.no?'low':(when==='now'?'strong':'mid'),c:slug});
  var head,kick;
  if(o.no){kick='Honest answer';head='Do not automate this yet';cap.innerHTML='Not every problem <span>needs a build.</span>'}
  else{kick='Start here';head=L.name+' <span style="display:block;color:var(--mute)">'+esc(L.em)+'</span>';cap.innerHTML=esc(L.name)+' <span>'+esc(L.em)+'</span>'}
  var call='<a class="btn'+((o.no||when==='looking')?' line':'')+'" href="'+CAL+'" target="_blank" rel="noopener">'+(o.no?'Get a second opinion':'Book a 20-minute call')+'</a>';
  var page='<a class="btn'+((o.no||when==='looking')?'':' line')+'" href="/'+slug+'/">See how it works</a>';
  var h='<div class="fade"><p class="kick">'+kick+'</p><div class="bar"></div><h2>'+head+'</h2><p class="why">'+esc(o.why)+'</p><dl class="rows">';
  if(!o.no){h+='<div><dt>What I do</dt><dd>'+esc(L.does)+'</dd></div><div><dt>First step</dt><dd>'+esc(L.first)+'</dd></div>'}
  else{h+='<div><dt>Try first</dt><dd>Write the steps down once, save the message you keep retyping, and see if that covers it.</dd></div><div><dt>Come back when</dt><dd>It is happening every week, or it starts costing you customers.</dd></div>'}
  if(o.note)h+='<div><dt>One caution</dt><dd>'+esc(o.note)+'</dd></div>';
  if(A)h+='<div><dt>Also worth a look</dt><dd><a href="/'+o.also+'/">'+esc(A.name)+' '+esc(A.em)+'</a></dd></div>';
  if(when==='looking'&&!o.no)h+='<div><dt>No rush</dt><dd>You said you are just looking. Read how it works first. The call is there when you want it.</dd></div>';
  h+='</dl><div class="acts">'+(o.no?call:(when==='looking'?page+call:call+page))+'</div>';
  h+='<div class="send"><p>Want this in writing? I will email you this answer. A copy lands in my inbox, so you can just reply.</p>'+
     '<form novalidate><input type="email" name="email" placeholder="you@yourbusiness.com" autocomplete="email" aria-label="Your email address" required>'+
     '<input type="text" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">'+
     '<button class="btn line" type="submit">Email it to me</button></form><p class="msg" role="alert"></p></div>';
  h+='<button type="button" class="back">← Start over</button></div>';
  stage.innerHTML=h;focusHead();
  stage.querySelector('.back').addEventListener('click',function(){ans={};one()});
  var f=stage.querySelector('form'),msg=stage.querySelector('.msg');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var em=f.email,btn=f.querySelector('button');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value)){msg.textContent='That email does not look right. Mind checking it?';em.focus();return}
    if(f.botcheck.value)return;   /* honeypot: a real person never fills this in */
    btn.disabled=true;btn.textContent='Sending...';msg.textContent='';
    var title=o.no?'Do not automate this yet':L.name+' '+L.em;
    var lines=['FIT CHECK RESULT','Answer: '+title,'',Q1.ask+'  >>  '+ans.q1.t,Q2[ans.q1.go].ask+'  >>  '+o.t,Q3.ask+'  >>  '+ans.q3.t,'','Why: '+o.why];
    if(!o.no){lines.push('What I do: '+L.does);lines.push('First step: '+L.first)}
    if(o.note)lines.push('One caution: '+o.note);
    if(A)lines.push('Also worth a look: '+A.name+' '+A.em);
    lines.push('');lines.push('Book a call: '+CAL);
    fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({access_key:'9dcf879b-c9aa-42b5-b01b-fbf09e383690',subject:'Fit Check ['+title+']',from_name:'PEC Fit Check',email:em.value,answer:title,timing:ans.q3.t,message:lines.join('\n')})})
    .then(function(r){return r.json()}).then(function(d){
      if(!d||!d.success)throw new Error('rejected');
      track('fc_email',{v:o.no?'low':(when==='now'?'strong':'mid'),c:slug});
      f.parentNode.innerHTML='<p>Sent. It is on its way to '+esc(em.value)+', and it landed in my inbox too, so you can just reply to it.</p>';
    }).catch(function(){
      btn.disabled=false;btn.textContent='Email it to me';
      msg.innerHTML='That did not go through. Email me directly at <a href="mailto:bryan@perseidechocreations.com">bryan@perseidechocreations.com</a>.';
    });
  });
}
one();
/* ?a=0,0,0 jumps straight to an answer (question 1, 2, 3 choices by position), for checking the page */
var pre=(location.search.match(/[?&]a=(\d),(\d),(\d)/)||0);
if(pre){try{ans.q1=Q1.opts[+pre[1]];ans.q2=Q2[ans.q1.go].opts[+pre[2]];ans.q3=Q3.opts[+pre[3]];result()}catch(e){ans={};one()}}
})();
</script>
