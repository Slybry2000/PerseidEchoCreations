<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
<!-- Automation: tools wired together; little pulses carry the work from one to the next while nobody types. -->
<style>
.m{animation:met 7.5s ease-in infinite;opacity:0}
@keyframes met{0%,70%{transform:translate(0,0);opacity:0}72%{opacity:1}86%{transform:translate(-420px,260px);opacity:0}100%{opacity:0}}
.n{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
.lbl{font-family:'Spline Sans Mono',Consolas,monospace;font-size:13px;letter-spacing:1px;fill:#F6F6F4;opacity:.75}
.cnt{font-family:'Archivo',Arial,sans-serif;font-weight:700;fill:#5EEAD4}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08181a"/><stop offset="1" stop-color="#0D1321"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#5EEAD4" stroke-opacity=".06"/></pattern>
</defs>
<rect width="600" height="900" fill="url(#bg)"/>
<rect width="600" height="900" fill="url(#grid)"/>
<g class="m"><rect x="560" y="70" width="140" height="2.5" rx="1.2" fill="url(#mt)" transform="rotate(-32 560 70)"/></g>
<!-- wires -->
<g fill="none" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="6 7">
 <path id="w1" d="M180 250 C300 250 300 380 420 380"/>
 <path id="w2" d="M420 380 C420 470 180 470 180 540"/>
 <path id="w3" d="M180 540 C300 540 300 680 420 680"/>
 <path id="w4" d="M180 250 C80 380 80 560 180 540"/>
</g>
<!-- pulses -->
<g fill="#5EEAD4">
 <circle r="7"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
 <circle r="7"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
 <circle r="7"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
 <circle r="5" fill="#FF6A2A"><animateMotion dur="3.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
</g>
<!-- tools -->
<g stroke="#5EEAD4" stroke-width="2" fill="#0D1321">
 <rect class="n" x="120" y="200" width="120" height="100" rx="18"/>
 <rect class="n" x="360" y="330" width="120" height="100" rx="18" style="animation-delay:-.8s"/>
 <rect class="n" x="120" y="490" width="120" height="100" rx="18" style="animation-delay:-1.6s"/>
 <rect class="n" x="360" y="630" width="120" height="100" rx="18" style="animation-delay:-2.4s"/>
</g>
<!-- tiny icons -->
<g fill="none" stroke="#F6F6F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
 <rect x="160" y="222" width="40" height="30" rx="4"/><path d="M168 234h24M168 242h14"/>
 <circle cx="420" cy="370" r="15"/><path d="M420 362v9l6 4"/>
 <path d="M162 512h36v32h-36zM170 524h20M170 532h12"/><path d="M190 506v10"/>
 <path d="M404 656h32a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-20l-10 8v-8h-2a6 6 0 0 1-6-6v-14a6 6 0 0 1 6-6z"/>
</g>
<text class="lbl" x="180" y="285" text-anchor="middle">NEW LEAD</text>
<text class="lbl" x="420" y="415" text-anchor="middle">BOOKED</text>
<text class="lbl" x="180" y="575" text-anchor="middle">INVOICED</text>
<text class="lbl" x="420" y="715" text-anchor="middle">FOLLOW-UP</text>
<!-- hours back -->
<g transform="translate(300,810)" text-anchor="middle"><text class="cnt" font-size="20" y="0">0 copy-paste</text><text class="lbl" y="26">THE WORK MOVES ON ITS OWN</text></g>
</svg>
