<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
<!-- Social: a phone feed that keeps scrolling with fresh posts; hearts float off it. -->
<style>
.feed{animation:feed 12s linear infinite}
@keyframes feed{from{transform:translateY(0)}to{transform:translateY(-600px)}}
.h{animation:heart 4s ease-out infinite;opacity:0}
@keyframes heart{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,30px),-260px) scale(1.15);opacity:0}}
.m{animation:met 8s ease-in infinite;opacity:0}
@keyframes met{0%,72%{transform:translate(0,0);opacity:0}74%{opacity:1}88%{transform:translate(-420px,260px);opacity:0}100%{opacity:0}}
.chk{animation:chk 4s ease-in-out infinite}
@keyframes chk{0%,20%{opacity:0;transform:scale(.6)}30%,85%{opacity:1;transform:scale(1)}100%{opacity:0}}
text{font-family:'Archivo',Arial,Helvetica,sans-serif}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f1f"/><stop offset="1" stop-color="#2a1424"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8FB1"/><stop offset="1" stop-color="#FF8FB1" stop-opacity="0"/></linearGradient>
<clipPath id="screen"><rect x="176" y="186" width="248" height="508" rx="24"/></clipPath>
<path id="hp" d="M0 6 C0 -2 10 -4 12 3 C14 -4 24 -2 24 6 C24 14 12 20 12 22 C12 20 0 14 0 6Z"/>
<g id="post">
 <rect x="0" y="0" width="224" height="280" rx="14" fill="#F6F6F4"/>
 <circle cx="20" cy="20" r="9" fill="#FF8FB1"/><rect x="36" y="15" width="80" height="9" rx="4" fill="#0D1321" opacity=".55"/>
 <rect x="10" y="40" width="204" height="160" rx="8" style="fill:var(--ph,#f3c6a5)"/>
 <path d="M10 200 L70 140 L110 175 L150 130 L214 200Z" fill="#0D1321" opacity=".18"/>
 <circle cx="170" cy="78" r="16" fill="#F6F6F4" opacity=".7"/>
 <rect x="12" y="214" width="170" height="9" rx="4" fill="#0D1321" opacity=".5"/>
 <rect x="12" y="232" width="120" height="9" rx="4" fill="#0D1321" opacity=".3"/>
 <use href="#hp" transform="translate(12,252) scale(.75)" fill="#FF6A2A"/>
</g>
</defs>
<rect width="600" height="900" fill="url(#bg)"/>
<g fill="#F6F6F4" opacity=".45"><circle cx="70" cy="80" r="1.3"/><circle cx="250" cy="50" r="1"/><circle cx="460" cy="110" r="1.5"/><circle cx="540" cy="240" r="1"/><circle cx="90" cy="300" r="1.2"/><circle cx="520" cy="820" r="1"/><circle cx="60" cy="760" r="1.4"/></g>
<g class="m"><rect x="560" y="60" width="140" height="2.5" rx="1.2" fill="url(#mt)" transform="rotate(-32 560 60)"/></g>
<!-- phone -->
<rect x="160" y="170" width="280" height="540" rx="38" fill="#0D1321" stroke="#F6F6F4" stroke-opacity=".25" stroke-width="2"/>
<g clip-path="url(#screen)">
 <rect x="176" y="186" width="248" height="508" fill="#ECEAE5"/>
 <g class="feed">
  <use href="#post" x="188" y="200" style="--ph:#f3c6a5"/>
  <use href="#post" x="188" y="500" style="--ph:#b9d8e8"/>
  <use href="#post" x="188" y="800" style="--ph:#f3c6a5"/>
  <use href="#post" x="188" y="1100" style="--ph:#b9d8e8"/>
 </g>
</g>
<rect x="262" y="182" width="76" height="10" rx="5" fill="#0D1321"/>
<!-- approved before it posts -->
<g transform="translate(400,250)"><g class="chk"><circle r="30" fill="#FF8FB1"/><path d="M-12 0 L-3 10 L13 -9" fill="none" stroke="#1a0f1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<!-- hearts -->
<g transform="translate(420,600)"><use class="h" href="#hp" fill="#FF8FB1" style="--dx:40px"/></g>
<g transform="translate(150,560)"><use class="h" href="#hp" fill="#FF6A2A" style="--dx:-50px;animation-delay:-1.3s"/></g>
<g transform="translate(430,470)"><use class="h" href="#hp" fill="#F6F6F4" style="--dx:60px;animation-delay:-2.6s"/></g>
<g transform="translate(140,690)"><use class="h" href="#hp" fill="#FF8FB1" style="--dx:-30px;animation-delay:-3.4s"/></g>
<!-- the week's schedule -->
<g transform="translate(130,760)" fill="#F6F6F4">
 <g opacity=".5"><rect x="0" y="0" width="40" height="40" rx="8" fill-opacity=".12"/><rect x="58" y="0" width="40" height="40" rx="8" fill-opacity=".12"/><rect x="116" y="0" width="40" height="40" rx="8" fill-opacity=".12"/><rect x="174" y="0" width="40" height="40" rx="8" fill-opacity=".12"/><rect x="232" y="0" width="40" height="40" rx="8" fill-opacity=".12"/><rect x="290" y="0" width="40" height="40" rx="8" fill-opacity=".12"/></g>
 <circle cx="20" cy="20" r="6" fill="#FF8FB1"/><circle cx="136" cy="20" r="6" fill="#FF8FB1"/><circle cx="252" cy="20" r="6" fill="#FF8FB1"/><circle cx="310" cy="20" r="6" fill="#FF6A2A"/>
</g>
</svg>
