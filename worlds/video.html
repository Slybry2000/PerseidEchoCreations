<style>
:root{--ink:#07090F;--paper:#F6F6F4;--pers:#FF6A2A}
html,body{margin:0;overflow:hidden;background:#07090F}
svg{display:block;width:1440px;height:900px}
text{font-family:'Archivo',Arial,sans-serif}
.mono{font-family:'IBM Plex Mono',Consolas,monospace}
.edge{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;letter-spacing:.2em;fill:#F6F6F4;opacity:.6}
.sf{stroke-dasharray:1}

/* ---------- animation (only under .play; base styles are the finished poster) ---------- */
.play .strip{animation:slide .85s cubic-bezier(.2,.7,.2,1) .1s both}
.play .ex{animation:expose .3s ease-out calc(.5s + var(--i) * .14s) both}
.sparkg{opacity:0}
.play .sparkg{animation:fly 1.05s cubic-bezier(.4,.1,.7,1) .35s both}
.lamp{transform-origin:152px 420px}
.play .lamp{animation:pop .55s cubic-bezier(.2,.8,.2,1) 1.38s both}
.play .house{animation:fadein .7s ease 1.4s both}
.ring{transform-origin:152px 420px}
.play .ring{animation:echo 1.2s cubic-bezier(.15,.7,.2,1) calc(1.4s + var(--i) * .15s) both}
.beam{transform-origin:152px 420px}
.play .beam{animation:beamopen .6s cubic-bezier(.25,.7,.25,1) 1.42s both}
.play .motes{animation:drift 1.2s ease-out 1.8s both}
.play .sf{animation:draw 1s cubic-bezier(.4,0,.2,1) .45s both}
.play .sdark{animation:fadein .6s ease .5s both}
.play .lit{animation:fadein .4s ease 1.7s both}
.sweepw{opacity:0}
.play .sweepw{animation:sweepw 1.1s linear 1.8s both}
.hand{transform-origin:1080px 419px}
.play .hand{animation:rot .8s cubic-bezier(.4,.05,.35,1) 1.85s both}
.play .pie{animation:pie .8s cubic-bezier(.4,.05,.35,1) 1.85s both}
.num{transform-origin:1080px 419px}
.play .num{animation:numin .4s cubic-bezier(.2,.7,.2,1) 2.5s both}
.play .t1{animation:fadeup .5s cubic-bezier(.2,.7,.2,1) 1.65s both}
.play .t2{animation:fadeup .8s cubic-bezier(.2,.7,.2,1) 1.8s both}
.play .t3{animation:fadeup .55s cubic-bezier(.2,.7,.2,1) 2.4s both}
.play .slate{animation:fadeup .55s cubic-bezier(.2,.7,.2,1) 2.55s both}
.arm{transform-origin:1040px 672px;transform:rotate(-8deg)}
.play .arm{animation:clap .6s cubic-bezier(.3,.6,.2,1) 2.6s both}
.play .runtime{animation:fadeup .5s cubic-bezier(.2,.7,.2,1) 2.75s both}
.xm{stroke-dasharray:1}
.play .xm{animation:draw .35s ease-out calc(2.95s + var(--i) * .15s) both}

@keyframes slide{from{transform:translateX(-380px);opacity:0}to{transform:none;opacity:1}}
@keyframes expose{from{opacity:1}to{opacity:0}}
@keyframes fly{0%{transform:translate(-192px,-130px);opacity:0}8%{opacity:1}55%{transform:translate(-84px,-44px)}92%{opacity:1}100%{transform:translate(0,0);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes echo{0%{transform:scale(.12);opacity:0}8%{opacity:.95}to{transform:scale(1);opacity:var(--o)}}
@keyframes beamopen{from{transform:scaleX(0);opacity:.35}to{transform:scaleX(1);opacity:1}}
@keyframes drift{from{opacity:0;transform:translate(-14px,8px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sweepw{0%{opacity:0}6%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pie{from{stroke-dashoffset:351.86}to{stroke-dashoffset:0}}
@keyframes numin{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes clap{from{transform:rotate(-30deg)}to{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sparkg{display:none!important}}
</style></head>

<script>
window.SPARK_ENTRY = {x:0, y:322.3, t:0.595};
(function(){
 var root=document.documentElement;
 var q=new URLSearchParams(location.search), T=q.get('t');
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 function reflow(){void root.getBoundingClientRect();}
 function freeze(t){document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000;});}
 window.play=function(){
  root.classList.remove('play');reflow();
  if(reduce)return;
  root.classList.add('play');reflow();
  var ends=document.getAnimations().map(function(a){return a.effect.getComputedTiming().endTime;});
  window.DURATION=Math.max.apply(null,ends)/1000;
  if(T!==null&&T!==''&&!isNaN(parseFloat(T)))freeze(parseFloat(T));
 };
 window.finish=function(){root.classList.remove('play');};
 window.addEventListener('message',function(e){if(e.data==='play')play();else if(e.data==='finish')finish();});
 play();
})();
</script></body></html>
