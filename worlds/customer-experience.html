.play .spark,.play .rg{display:inline}

.play .gA{stroke-dasharray:1 2;animation:draw .85s var(--out) .35s backwards}
.play .gB{stroke-dasharray:1 2;animation:draw .8s var(--out) .5s backwards}
.play .river{stroke-dasharray:1 2;animation:draw 1s var(--io) .15s backwards}
.play .park{animation:fade .6s linear .5s backwards}
.play .zone{animation:fade .5s linear .3s backwards}
.play .idx{animation:fade .5s linear 0s backwards}
.play .tk{animation:fade .45s linear .95s backwards}
.play .fl{animation:fade .45s linear 1.0s backwards}
.play .stub{animation:fade .3s linear .95s backwards}
.play .ink{stroke-dasharray:1 2;animation:inkdraw 2.4s linear 0s backwards}
.play .core{stroke-dasharray:1 2;animation:draw 1.30s linear 1.30s backwards}
.play .pill{animation:fade .35s linear .6s backwards}
.play .sparkg{animation:flight 1.2s linear 0.1s backwards}
.play .sparkall{animation:sparkfade 1.2s linear 0.1s both}
.play .tl1{stroke-dasharray:0.2 5;animation:tail1 1.2s linear 0.1s backwards}
.play .tl2{stroke-dasharray:0.09 5;animation:tail2 1.2s linear 0.1s backwards}
.play .mkride{animation:ride 1.30s linear 1.30s backwards}
.play .mkpop{animation:mkpop .32s var(--out) 1.30s backwards}
.play .rg1{animation:ring .95s cubic-bezier(.2,.6,.3,1) 1.3s both}
.play .rg2{animation:ring .95s cubic-bezier(.2,.6,.3,1) 1.42s both}
.play .rg3{animation:ring .95s cubic-bezier(.2,.6,.3,1) 1.54s both}
.play .rt1{animation:ringT .9s cubic-bezier(.2,.6,.3,1) 2.60s both}
.play .rt2{animation:ringT .9s cubic-bezier(.2,.6,.3,1) 2.72s both}
.play .rt3{animation:ringT .9s cubic-bezier(.2,.6,.3,1) 2.84s both}
.play .termlb{animation:wipeX .45s var(--out) 2.60s backwards}
.play .tlab{animation:fadeUp .4s var(--out) 1.65s backwards}
.play .trule{transform-box:fill-box;transform-origin:0 50%;animation:wipeX .45s var(--out) 1.7s backwards}
.play .h1a{animation:rise .6s cubic-bezier(.2,.9,.25,1) 1.75s backwards}
.play .h1b{animation:rise .6s cubic-bezier(.2,.9,.25,1) 1.92s backwards}
.play .ds{animation:fadeUp .45s var(--out) 2.4s backwards}
.play .legend{animation:legin .55s var(--out) 2.6s backwards}
.play .remnant{animation:fade .5s linear 2.60s backwards}
.play .foot{animation:fade .5s linear 2.9s backwards}
.play .stp0{animation:pop .3s var(--out) 1.210s backwards}
.play .lb0{animation:lbin .4s var(--out) 1.280s backwards}
.play .nm0{animation:fade .3s linear 1.350s backwards}
.play .stp1{animation:pop .3s var(--out) 1.389s backwards}
.play .lb1{animation:lbin .4s var(--out) 1.459s backwards}
.play .nm1{animation:fade .3s linear 1.529s backwards}
.play .stp2{animation:pop .3s var(--out) 1.565s backwards}
.play .lb2{animation:lbin .4s var(--out) 1.635s backwards}
.play .nm2{animation:fade .3s linear 1.705s backwards}
.play .stp3{animation:pop .3s var(--out) 1.763s backwards}
.play .lb3{animation:lbin .4s var(--out) 1.833s backwards}
.play .nm3{animation:fade .3s linear 1.903s backwards}
.play .stp4{animation:pop .3s var(--out) 1.939s backwards}
.play .lb4{animation:lbin .4s var(--out) 2.009s backwards}
.play .nm4{animation:fade .3s linear 2.079s backwards}
.play .stp5{animation:pop .3s var(--out) 2.137s backwards}
.play .lb5{animation:lbin .4s var(--out) 2.207s backwards}
.play .nm5{animation:fade .3s linear 2.277s backwards}
.play .stp6{animation:pop .3s var(--out) 2.313s backwards}
.play .lb6{animation:lbin .4s var(--out) 2.383s backwards}
.play .nm6{animation:fade .3s linear 2.453s backwards}
.play .stp7{animation:pop .3s var(--out) 2.510s backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark,.rg{display:none!important}}

<script>

(function(){
 var root=document.documentElement;
 var q=new URLSearchParams(location.search), T=q.get('t');
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 function reflow(){void root.getBoundingClientRect();}
 function freeze(t){document.getAnimations().forEach(function(a){a.pause();a.currentTime=t*1000;});}
 window.play=function(){
  root.classList.remove('play');reflow();
  if(reduce)return;
  root.classList.add('play');reflow();
  var ends=document.getAnimations().map(function(a){return a.effect.getComputedTiming().endTime;});
  window.DURATION=Math.max.apply(null,ends)/1000;
  if(T!==null&&T!==''&&!isNaN(parseFloat(T)))freeze(parseFloat(T));
 };
 window.finish=function(){root.classList.remove('play');};
 window.addEventListener('message',function(e){if(e.data==='play')play();else if(e.data==='finish')finish();});
 play();
})();
