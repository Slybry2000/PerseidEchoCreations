<!doctype html>
<!-- Share image, 1200x630. Screenshot this page at that size to make /art/og-seven.jpg -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0D1321;color:#F6F6F4;font-family:Archivo,Arial,sans-serif;display:flex}
.l{flex:1;padding:56px 0 52px 64px;display:flex;flex-direction:column}
.brand{font-weight:800;font-size:19px;letter-spacing:.16em}
.kick{margin-top:auto;font-weight:800;font-size:17px;letter-spacing:.18em;color:#FF6A2A;text-transform:uppercase}
h1{margin:18px 0 0;font-weight:800;font-size:92px;line-height:.94;letter-spacing:-.02em;text-transform:uppercase}
h1 span{display:block;color:#8D94A3}
p{margin:26px 0 0;font-size:25px;line-height:1.3;opacity:.9;max-width:17em}
.r{display:flex;width:490px;flex:none}
.s{flex:1;display:flex;flex-direction:column;align-items:center;padding:34px 0 30px;box-shadow:inset 1px 0 0 rgba(13,19,33,.9)}
.s i{font-style:normal;font-weight:800;font-size:17px;letter-spacing:.06em}
.s em{margin-top:auto;font-style:normal;font-weight:800;font-size:17px;letter-spacing:.2em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.w1{background:#FCFAF4;color:#0D1321}.w2{background:#FF6A2A;color:#0D1321}.w3{background:#16233F}.w4{background:#F6F6F4;color:#0D1321}
.w5{background:#fff;color:#0D1321}.w6{background:#07090F}.w7{background:#F5F1E6;color:#0D1321}
</style></head><body>
<div class="l">
  <div class="brand">PERSEID ECHO CREATIONS</div>
  <div class="kick">Seven services, done for you</div>
  <h1>You do the work. <span>I take the rest.</span></h1>
  <p>Find the one that fits your business in about a minute.</p>
</div>
<div class="r">
  <div class="s w1"><i>01</i><em>Cold email</em></div>
  <div class="s w2"><i>02</i><em>Social media</em></div>
  <div class="s w3"><i>03</i><em>Automation</em></div>
  <div class="s w4"><i>04</i><em>Customer experience</em></div>
  <div class="s w5"><i>05</i><em>Digital design</em></div>
  <div class="s w6"><i>06</i><em>Video</em></div>
  <div class="s w7"><i>07</i><em>Team playbooks</em></div>
</div>
</body></html>
