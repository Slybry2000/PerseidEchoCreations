.play .t2{animation:wipeX .5s steps(52,end) .85s backwards}

.play .desc{animation:fadeUp .4s var(--out) 2.15s backwards}
.play .reg{transform-origin:1284px 715px;animation:pressin .42s var(--out) 2.3s backwards}
.play .bar{animation:wipeX .5s var(--io) 2.45s backwards}

@keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes sparkend{0%,90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3)}}
@keyframes dash{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes wipeX{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeY{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes echoin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pmstamp{
 0%{opacity:0;transform:scale(1.25);animation-timing-function:cubic-bezier(.1,.8,.2,1)}
 42%{opacity:1;transform:scale(.982);animation-timing-function:cubic-bezier(.4,0,.4,1)}
 72%{opacity:1;transform:scale(1.006);animation-timing-function:cubic-bezier(.4,0,.4,1)}
 100%{opacity:1;transform:scale(1)}}
@keyframes headin{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:scale(1)}}
@keyframes ring{0%{opacity:0;transform:scale(.04)}8%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes rise{from{transform:translateY(150px)}to{transform:translateY(0)}}
@keyframes pressin{from{opacity:0;transform:scale(1.16)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark,.rg{display:none!important}}
